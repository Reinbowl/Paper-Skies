<!doctype html>
<html lang=en>
<head>
<meta charset=utf-8>
<title>Paper Skies</title>
<meta name=viewport content="width=device-width,initial-scale=1">
<meta name=theme-color content=#efe6d6>
<style>
/* The class on <body> is the state of the page:
   l = loading, m = menu, g = in the scene (g p while the mouse is captured), l e = failed to start */
html { background: #efe6d6; }
body {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%; margin: 0; overflow: hidden;
  background: radial-gradient(120% 90% at 50% 40%, #fbf7ef, #efe6d6 60%, #e2d6c1);
  font: 600 clamp(13px, .7vw + .9vh, 34px)/1.45 system-ui, sans-serif; color: #2e2b33;
  -webkit-user-select: none; user-select: none;
}
/* a phone held upright gets the whole page turned on its side, so the scene is always landscape */
@media (orientation: portrait) and (pointer: coarse) {
  body { width: 100dvh; height: 100dvw; transform-origin: 0 0; transform: rotate(90deg) translateY(-100%); }
}

/* the scene: softened behind the menu like seen through rice paper, comes into focus when you fly */
canvas {
  position: absolute; width: 100%; height: 100%; touch-action: none; cursor: crosshair;
  transition: filter 1.2s, transform 1.2s, opacity 2s;
}
body:not(.g) canvas { filter: blur(.8vmax) saturate(.85) brightness(1.04); transform: scale(1.05); }
.l canvas { opacity: 0; }

/* menu: the loading bar and the buttons share one grid cell, so nothing jumps when they swap */
#m {
  position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: min(2em, 5vmin);
  padding: 1em; text-align: center;
  background: radial-gradient(closest-side, #fbf7efd9, #f6f0e4a6 55%, #efe6d633);
  transition: opacity .6s, visibility .6s;
}
.g #m, .m #l, .l #g { opacity: 0; visibility: hidden; }
#m svg { width: 3.6em; height: 3.6em; margin-bottom: -.6em; }
h1 {
  margin: 0; font: 400 4.2em/1 "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  letter-spacing: .08em; color: #2e2b33;
}
#n { margin: -.6em 0 0; font-size: .8em; letter-spacing: .5em; text-transform: uppercase; color: #8a7f72; }
p { margin: 0; }
#a { display: grid; width: 26em; max-width: 100%; }
#a > * { grid-area: 1/1; transition: opacity .8s, visibility .8s; }
#s, #w, #q, #k, #h { font-size: .8em; letter-spacing: .12em; text-transform: uppercase; }
#s { color: #6d6458; }
#w { margin-top: 1.2em; color: #b5533c; text-wrap: balance; }

/* loading bar: a strip of paper filling with ink */
#p { height: .35em; margin: .4em 0 1em; overflow: hidden; background: #e4d9c6; box-shadow: inset 0 1px 2px #0002; }
#b {
  display: block; height: 100%; background: linear-gradient(90deg, #c8553d, #e08a5c);
  transform: scaleX(0); transform-origin: 0; will-change: transform;
}
.e #p { visibility: hidden; }
.e #s { font-size: 1.1em; letter-spacing: 0; text-transform: none; color: #2e2b33; }

/* buttons: folded paper tags with a dog-eared corner */
button {
  position: relative; display: flex; align-items: center; justify-content: center; gap: .6em; padding: .8em 1.4em; border: 0;
  background: #fbf7ef; box-shadow: 0 .15em .1em #6b5a4426, 0 .5em 1.2em #6b5a4422;
  clip-path: polygon(0 0, calc(100% - .9em) 0, 100% .9em, 100% 100%, 0 100%);
  font: 700 1em/1.2 system-ui, sans-serif; letter-spacing: .14em; text-transform: uppercase;
  color: #2e2b33; cursor: pointer; transition: transform .15s, filter .15s;
}
button::after {
  content: ''; position: absolute; top: 0; right: 0; width: .9em; height: .9em;
  background: linear-gradient(225deg, #0000 50%, #0000001f 50%, #ffffff66);
}
button:hover { transform: translateY(-.12em); filter: brightness(1.04); }
button:active { transform: translateY(.08em); filter: brightness(.96); }
:focus-visible { outline: 2px solid #c8553d; outline-offset: 3px; }
#g { display: grid; gap: min(1.1em, 3.2vmin); justify-items: stretch; }
#r { display: flex; gap: 1em; }
#r button { flex: 1; padding: 1em; font-size: 1.2em; }
#fly { background: #c8553d; color: #fdf7ee; }
#auto { background: #34506f; color: #f3efe6; }

/* soft plates under the buttons: detail level, list of controls, touch hint */
#q, #k, #h { padding: .9em 1.4em; background: #fbf7efb3; box-shadow: 0 .3em 1em #6b5a441a; }

/* detail level: three buttons in a row, the current one lit */
#q { display: flex; align-items: center; gap: .4em; padding: .4em; }
#q span { flex: 1; color: #8a7f72; }
#q button { flex: 1.2; padding: .6em 0; background: none; box-shadow: none; clip-path: none; }
#q button::after { display: none; }
#q button:hover { background: #2e2b3310; }
#q .on { background: #2e2b33; color: #fbf7ef; pointer-events: none; }

/* list of controls: two groups, key caps right-aligned against their labels */
#k { display: flex; justify-content: center; gap: 2em; text-align: left; }
#k p { display: grid; grid-template-columns: auto auto; align-content: start; align-items: center; gap: .55em .9em; }
#k p + p { padding-left: 2em; border-left: 1px solid #2e2b3326; }
#k i { display: flex; justify-self: end; align-items: center; gap: .25em; font-style: normal; color: #8a7f72; }
#k b {
  min-width: 1.1em; padding: .15em .5em; background: #fff; box-shadow: 0 .12em #2e2b3333;
  color: #2e2b33; text-align: center;
}
#h { display: none; }
@media (pointer: coarse), (max-height: 30em) {
  #k { display: none; }
}
@media (pointer: coarse) {
  #h { display: block; }
}

/* in the scene: a small menu button (hidden while the mouse is captured, Esc does the same), the mode toast and stats */
#o {
  position: absolute; top: .6em; right: .6em; display: none; padding: .3em .7em; font-size: 1.3em; opacity: .85;
}
.g #o { display: flex; }
.p #o { display: none; }
#t {
  position: absolute; left: 50%; bottom: 8%; margin: 0; padding: .5em 1.4em; transform: translateX(-50%);
  font-size: .85em; letter-spacing: .4em; text-transform: uppercase; color: #fbf7ef; background: #2e2b3366;
  opacity: 0; transition: opacity .8s; pointer-events: none;
}
#t.on { opacity: 1; transition: opacity .3s; }
#i {
  position: absolute; top: 1em; left: 1.2em; margin: 0; font: .8em/1.6 ui-monospace, Consolas, monospace;
  color: #fff; white-space: pre-wrap; text-shadow: 0 1px 4px #000; pointer-events: none;
}
</style>
</head>
<body class=l>
<canvas id=c></canvas>
<div id=m>
  <svg viewBox="0 0 64 40"><path fill=#c8553d d="M2 20 62 4 26 26z"/><path fill=#9c3f2c d="M26 26 62 4 30 36z"/><path fill=#e9a17f d="M2 20 26 26 22 30z"/></svg>
  <h1>Paper Skies</h1>
  <p id=n>an origami flight</p>
  <div id=a>
    <div id=l><div id=p><i id=b></i></div><p id=s>Unfolding…</p><p id=w hidden>Use Google Chrome for the best experience</p></div>
    <div id=g>
      <div id=r><button id=fly>Fly</button><button id=auto>Autopilot</button></div>
      <p id=q><span>Detail</span><button>Low</button><button>Medium</button><button>High</button></p>
      <div id=k>
        <p>
          <i><b>Mouse</b></i>Steer
          <i><b>W</b><b>A</b><b>S</b><b>D</b></i>Climb · turn
          <i><b>Shift</b></i>Gust
          <i><b>Tab</b></i>Fly / autopilot
        </p>
        <p>
          <i><b>T</b></i>Hurry time
          <i><b>Esc</b></i>Menu
          <i><b>M</b></i>Mute
          <i><b>H</b></i>Stats
        </p>
      </div>
      <p id=h>Hold and slide to steer · second finger for a gust</p>
    </div>
  </div>
</div>
<button id=o aria-label=Menu>≡</button>
<p id=t></p>
<pre id=i></pre>
<script>
/*SCRIPT*/
</script>
</body>
</html>
